<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>词海无涯，回头是岸</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1c2540; --muted:#6b7590;
  --line:#e4e8f2; --brand:#3b5bdb; --brand-weak:#eef2ff; --brand-ink:#2b49c4;
  --good:#0f9d58; --good-weak:#e8f6ee; --bad:#d93025; --bad-weak:#fdeceb;
  --warn:#b26a00; --warn-weak:#fff6e5;
  --radius:16px; --shadow:0 1px 2px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
#app{max-width:820px;margin:0 auto;padding:22px 18px 60px}
.hidden{display:none!important}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:disabled{cursor:not-allowed;opacity:.55}
input{font:inherit}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;min-height:38px}
.topbar .title{font-weight:700;font-size:18px}
.topbar .spacer{flex:1}
.icon-btn{padding:7px 13px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  color:var(--muted);font-size:15px;transition:.15s}
.icon-btn:hover{color:var(--brand);border-color:#c9d3f5}

/* ---------- home ---------- */
.hero{text-align:center;padding:26px 0 24px}
.hero h1{font-size:30px;margin-bottom:8px}
.hero p{color:var(--muted);margin:0}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:640px){
  #app{padding:16px 14px 46px}
  .hero{padding:14px 0 16px}
  .hero h1{font-size:25px}
  .hero p{font-size:14.5px}
  .mode-grid{grid-template-columns:1fr;gap:9px}
  .mode{padding:13px 15px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;
        column-gap:12px;align-items:center}
  .mode .emoji{grid-row:1/4;align-self:center;font-size:22px;margin:0;width:28px;text-align:center;line-height:1}
  .mode .name{font-size:16.5px;margin:0}
  .mode .desc{font-size:13px;line-height:1.45;margin-top:1px}
  .mode .stat{margin-top:4px;font-size:12.5px}
  .stats{gap:9px;margin-top:12px}
  .stat-card{padding:11px 12px;border-radius:12px}
  .stat-card b{font-size:20px}
  .stat-card span{font-size:12px}
  .card{padding:19px 16px;border-radius:14px}
  .prompt{font-size:22px}
  .prompt-cn{font-size:21px}
  .word-head .big{font-size:38px}
  .answer-input{font-size:19px;padding:13px 14px}
  .btn{padding:12px 12px;font-size:15.5px}
  .actions{gap:8px}
  .actions .btn{flex:1 1 0;min-width:0;padding-left:6px;padding-right:6px}
  .actions .btn-primary{min-width:0}
  .opt{font-size:16px;padding:12px 13px}
}
.mode{
  background:var(--card);border-radius:var(--radius);padding:22px 18px;text-align:left;
  border:1px solid var(--line);box-shadow:var(--shadow);transition:.18s;position:relative;overflow:hidden;
}
.mode:hover{transform:translateY(-2px);border-color:#c9d3f5}
.mode .emoji{font-size:24px;display:block;margin-bottom:8px}
.mode .name{display:block;font-weight:700;font-size:19px;margin-bottom:4px}
.mode .desc{display:block;color:var(--muted);font-size:14px;line-height:1.55}
.mode .stat{display:block;margin-top:10px;font-size:13px;color:var(--brand-ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat-card b{display:block;font-size:24px;line-height:1.2}
.stat-card span{color:var(--muted);font-size:13px}
.tips{margin-top:22px;color:var(--muted);font-size:13.5px;text-align:center}

/* ---------- 词书选择 ---------- */
.book-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
.book-card{
  position:relative;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:20px 18px;box-shadow:var(--shadow);transition:.18s;
  display:flex;flex-direction:column;gap:3px;min-height:150px;
}
.book-card:hover{transform:translateY(-2px);border-color:#c9d3f5}
.book-card .book-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.book-name{font-weight:700;font-size:20px;letter-spacing:-.01em}
.book-tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;
  background:var(--good-weak);color:#0b7a44;white-space:nowrap}
.book-tag.lock{background:#eef1f8;color:#8a93a8}
.book-sub{font-size:12px;color:var(--brand-ink);font-weight:700;letter-spacing:.06em}
.book-desc{font-size:13.5px;color:var(--muted);line-height:1.5;margin-top:2px}
.book-foot{margin-top:auto;font-size:13.5px;font-weight:700;color:var(--brand);padding-top:12px}
.book-card.soon{
  background:#f7f8fc;border-style:dashed;box-shadow:none;cursor:pointer;
  filter:grayscale(1);opacity:.72;
}
.book-card.soon .book-name,.book-card.soon .book-foot{color:#8a93a8}
.book-card.soon:hover{transform:none;opacity:.85}
.book-chip{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);
  border-radius:99px;padding:3px 10px;background:var(--card)}
@media(max-width:640px){.book-grid{grid-template-columns:1fr;gap:10px}.book-card{min-height:0;padding:14px 15px}}

/* ---------- progress ---------- */
.progress-wrap{margin-bottom:16px}
.progress-head{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted);margin-bottom:8px}
.progress-head b{color:var(--ink);font-size:15px}
.bar{height:8px;background:#e6eaf4;border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#5b7cfa,#3b5bdb);
  border-radius:99px;transition:width .3s ease}
.bar.warn > i{background:linear-gradient(90deg,#ffb020,#f59f00)}

/* ---------- question card ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:26px 24px}
.prompt-label{font-size:13px;color:var(--muted);margin-bottom:8px;letter-spacing:.02em}
.prompt{font-size:26px;font-weight:700;line-height:1.45;word-break:break-word}
.prompt.word{font-family:Georgia,"Times New Roman",serif;font-size:40px;letter-spacing:.01em}
.prompt-cn{font-size:24px;font-weight:700;line-height:1.5;color:var(--ink)}
.phon{color:var(--muted);font-size:15px;margin-top:2px}

/* ---------- dictation input ---------- */
.answer-row{margin-top:22px}
.answer-input{
  width:100%;padding:15px 16px;font-size:21px;border:1.5px solid var(--line);
  border-radius:12px;outline:none;background:#fbfcff;transition:.15s;
  font-family:Georgia,"Times New Roman",serif;letter-spacing:.02em;
}
.answer-input:focus{border-color:#8ea6f8;background:#fff;box-shadow:0 0 0 3px #eef2ff}
.answer-input.ok{border-color:#7bcf9d;background:var(--good-weak)}
.answer-input.err{border-color:#f0a9a3;background:var(--bad-weak)}

.hint-row{margin-top:12px;display:flex;align-items:center;gap:10px;min-height:26px}
.hint-text{font-family:Georgia,"Times New Roman",serif;font-size:23px;letter-spacing:.06em;color:var(--brand-ink)}
.hint-empty{font-size:13.5px;color:var(--muted)}

.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{padding:13px 22px;border-radius:12px;font-weight:600;font-size:16px;transition:.15s;border:1px solid transparent}
.btn-primary{background:var(--brand);color:#fff;flex:1;min-width:130px}
.btn-primary:hover{background:#3350c9}
.btn-ghost{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:#c9d3f5;color:var(--brand)}
.btn-warn{background:var(--warn-weak);color:var(--warn);border-color:#f2dfb5}
.btn-warn:hover{background:#ffeecb}
.btn:disabled{opacity:.5}

/* ---------- feedback ---------- */
.feedback{margin-top:18px;border-radius:12px;padding:14px 16px;font-size:15px;display:none}
.feedback.show{display:block;animation:pop .18s ease}
.feedback.ok{background:var(--good-weak);color:#0b7a44;border:1px solid #c9ebd7}
.feedback.err{background:var(--bad-weak);color:#b3261e;border:1px solid #f6cdc9}
.feedback.skip{background:var(--warn-weak);color:var(--warn);border:1px solid #f2dfb5}
.feedback .line{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.feedback .line:first-child{margin-top:0}
.feedback .k{color:var(--muted);min-width:44px}
.feedback .v{font-weight:600;word-break:break-word}
.feedback .you{color:#b3261e;text-decoration:line-through;text-decoration-color:rgba(179,38,30,.45)}
.answer-reveal{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.answer-reveal .word{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700}
.answer-reveal .cn{font-size:20px;font-weight:700;margin-top:4px}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---------- multiple choice ---------- */
.word-head{text-align:center;padding:10px 0 20px}
.word-head .big{font-family:Georgia,"Times New Roman",serif;font-size:46px;font-weight:700;line-height:1.15}
.options{margin-top:8px;display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:12px;
  border:1.5px solid var(--line);background:#fbfcff;text-align:left;transition:.13s;
  font-size:17px;line-height:1.5;width:100%
}
.opt:hover{border-color:#b9c7f2;background:#f7f9ff}
.opt .box{width:22px;height:22px;border-radius:6px;border:1.5px solid #c3cadd;flex:0 0 auto;
  margin-top:1px;display:grid;place-items:center;font-size:14px;color:#fff;transition:.12s}
.opt .txt{flex:1}
.opt .txt .pos{font-style:normal;color:var(--muted);font-size:14px;margin-right:4px;font-weight:600}
.opt.sel .txt .pos{color:var(--brand-ink)}
.opt.sel{border-color:#8ea6f8;background:var(--brand-weak)}
.opt.sel .box{background:var(--brand);border-color:var(--brand)}
.opt.correct{border-color:#7bcf9d;background:var(--good-weak)}
.opt.correct .box{background:var(--good);border-color:var(--good)}
.opt.wrong{border-color:#f0a9a3;background:var(--bad-weak)}
.opt.wrong .box{background:var(--bad);border-color:var(--bad)}
.opt.locked:hover{border-color:inherit;background:inherit}

/* ---------- result ---------- */
.result-hero{text-align:center;padding:8px 0 20px}
.score-ring{width:132px;height:132px;border-radius:50%;margin:0 auto 16px;
  display:grid;place-items:center;position:relative;background:#eef1f8}
.score-ring .inner{width:104px;height:104px;border-radius:50%;background:var(--card);
  display:grid;place-items:center;flex-direction:column;text-align:center}
.score-ring .num{font-size:32px;font-weight:800;line-height:1}
.score-ring .lab{font-size:12px;color:var(--muted);margin-top:3px}
.result-line{color:var(--muted);font-size:15px}
.result-line b{color:var(--ink)}
.wrong-list{margin-top:22px}
.wrong-list h3{font-size:16px;margin-bottom:10px}
.wlist{display:flex;flex-direction:column;gap:8px}
.wrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px}
.wrow .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.wrow .w{font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:700}
.wrow .tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bad-weak);color:var(--bad);font-weight:600}
.wrow .tag.hint{background:var(--warn-weak);color:var(--warn)}
.wrow .tag.skip{background:#eef1f8;color:var(--muted)}
.wrow .m{color:var(--muted);font-size:14px;margin-top:2px}
.wrow .a{font-size:13.5px;margin-top:6px;color:var(--bad)}
.wrow .a b{color:var(--ink);font-weight:600}

/* ---------- notebook ---------- */
.nb-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.seg{display:flex;background:#e9edf6;border-radius:11px;padding:3px}
.seg button{padding:8px 14px;border-radius:9px;font-size:14px;color:var(--muted);font-weight:600}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,30,60,.1)}
.nb-list{display:flex;flex-direction:column;gap:9px}
.nb-item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;
  display:flex;align-items:flex-start;gap:12px}
.nb-item .main{flex:1;min-width:0}
.nb-item .w{font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:700;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;background:#fdeceb;color:#c5221f;border-radius:8px;padding:1px 7px;line-height:1.6}
.badge.hint{background:var(--warn-weak);color:var(--warn)}
.nb-item .m{color:var(--muted);font-size:14px;margin-top:2px}
.nb-item .meta{font-size:12.5px;color:#9aa3b8;margin-top:4px}
.nb-item .del{color:var(--muted);font-size:13px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);flex:0 0 auto}
.nb-item .del:hover{color:var(--bad);border-color:#f6cdc9;background:var(--bad-weak)}
.empty{text-align:center;color:var(--muted);padding:56px 10px}
.empty .big{font-size:40px;display:block;margin-bottom:10px;opacity:.65}

/* ---------- toast / modal ---------- */
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:#1c2540;color:#fff;
  padding:11px 18px;border-radius:11px;font-size:14.5px;opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:88vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal-mask{position:fixed;inset:0;background:rgba(18,26,48,.42);display:grid;place-items:center;z-index:70;padding:20px}
.modal{background:var(--card);border-radius:16px;max-width:420px;width:100%;padding:22px}
.modal h3{font-size:19px;margin-bottom:8px}
.modal p{color:var(--muted);font-size:15px;margin:0 0 18px}
.modal .row{display:flex;gap:10px;justify-content:flex-end}
.danger{background:var(--bad);color:#fff}

/* footer data tools */
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:10px;
  flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.foot .spacer{flex:1}
.file-btn{position:relative;overflow:hidden;display:inline-block}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.small-link{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.small-link:hover{color:var(--brand)}
</style>

<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* ============================================================
   四级词汇自测 —— 单文件版
   数据：__VOCAB_COUNT__ 个词条，内嵌在下面 VOCAB 中
   ============================================================ */
const VOCAB_RAW = __VOCAB_DATA__;

const VOCAB = VOCAB_RAW.map(function (r, i) {
  return {
    id: i,
    word: r.w,
    short: r.s,
    groups: (r.g || []).map(function (x) {
      return { pos: x.p || '', text: x.t, kind: x.k || 'core', concept: x.c || '' };
    })
  };
});

/* ---------------- storage ---------------- */
const STORE_KEY = 'cet4-vocab-v1';
const DEFAULT_STATE = {
  version: 1,
  stats: {},        // id -> {t,w,h,nb,last,at}  t=tested w=wrong h=hint nb=in notebook
  sessions: [],     // {mode, at, total, correct, wrong, skipped}
  settings: { size: 25 }
};

function uid() { return Math.random().toString(36).slice(2, 10); }

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    const s = JSON.parse(raw);
    return Object.assign({}, DEFAULT_STATE, s, {
      stats: s.stats || {},
      sessions: Array.isArray(s.sessions) ? s.sessions : [],
      settings: Object.assign({}, DEFAULT_STATE.settings, s.settings || {})
    });
  } catch (e) {
    console.warn('读取存档失败', e);
    return JSON.parse(JSON.stringify(DEFAULT_STATE));
  }
}
let STATE = loadState();

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(STATE));
    return true;
  } catch (e) {
    toast('保存失败：浏览器存储不可用或已满');
    return false;
  }
}

function statOf(id) {
  let s = STATE.stats[id];
  if (!s) {
    s = { t: 0, w: 0, h: false, nb: false, last: '', at: 0 };
    STATE.stats[id] = s;
  }
  return s;
}

/* ---------------- helpers ---------------- */
const $ = function (sel, root) { return (root || document).querySelector(sel); };
const $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
const esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};
function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = r[i]; r[i] = r[j]; r[j] = t;
  }
  return r;
}
function sample(a, n) { return shuffle(a).slice(0, n); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

let toastTimer = null;
function toast(msg, ms) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, ms || 1900);
}

/* ---------------- app state ---------------- */
const APP = { screen: 'books', session: null, book: 'cet4' };

/* ============================================================
   词书
   ============================================================ */
const BOOKS = [
  { id: 'cet4', name: '四级词汇', sub: 'CET-4', desc: '大学英语四级核心词汇', ready: true },
  { id: 'cet6', name: '六级词汇', sub: 'CET-6', desc: '大学英语六级核心词汇', ready: false },
  { id: 'gaokao', name: '高考词汇', sub: 'Gaokao', desc: '高中英语考纲词汇', ready: false }
];

/* ============================================================
   选择题目
   规则：
   1. 生词本（答错 / 不会 / 给过提示）最多抽 5 题，错误多的优先
   2. 其余全部抽「从没考过」的新词
   3. 生词本不足 5 个时，新词数量自动补足（20 → 21、22…）
   4. 考过且答对、已不在生词本的词不重复考；只有新词耗尽时才按「最久没考」回收
   ============================================================ */
function buildQueue(mode) {
  const total = STATE.settings.size || 25;
  const reviewMax = 5;

  const fresh = [];     // 从没考过
  const notebook = [];  // 在生词本里
  const settled = [];   // 考过、答对、已移出生词本

  for (let i = 0; i < VOCAB.length; i++) {
    const st = STATE.stats[i];
    if (!st || !st.t) fresh.push(i);
    else if (st.nb) notebook.push(i);
    else settled.push(i);
  }

  // 生词本排序：错误多的优先 → 给过提示的次之 → 最久没考的优先
  const score = function (id) {
    const s = STATE.stats[id] || {};
    return (s.w || 0) * 2 + (s.h ? 1 : 0);
  };
  notebook.sort(function (a, b) {
    const d = score(b) - score(a);
    if (d) return d;
    return (STATE.stats[a].at || 0) - (STATE.stats[b].at || 0);
  });

  const picked = [];
  // 1) 生词本：最多 5 题
  pickInto(picked, notebook, Math.min(reviewMax, total));
  // 2) 新词补满（生词本少时新词自动变多）
  pickInto(picked, shuffle(fresh), total);
  // 3) 只有新词耗尽，才回收「考过且答对」的词，最久没考的优先
  if (picked.length < total) {
    settled.sort(function (a, b) { return ((STATE.stats[a].at || 0) - (STATE.stats[b].at || 0)); });
    pickInto(picked, settled, total);
  }
  // 4) 极端兜底（理论上不会走到）
  if (picked.length < total) {
    const rest = shuffle(VOCAB.map(function (_, i) { return i; }).filter(function (id) { return picked.indexOf(id) < 0; }));
    pickInto(picked, rest, total);
  }
  return shuffle(picked).slice(0, total);
}

function pickInto(out, pool, need) {
  for (let i = 0; i < pool.length && out.length < need; i++) {
    if (out.indexOf(pool[i]) < 0) out.push(pool[i]);
  }
}

/* ============================================================
   默写判定
   ============================================================ */
function normAnswer(s) {
  return String(s || '')
    .replace(/\u3000/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}
function stripHyphen(s) { return s.replace(/[-\u2010-\u2015]/g, ''); }
function answerMatches(input, target) {
  const a = normAnswer(input), b = normAnswer(target);
  if (!a) return false;
  if (a === b) return true;
  // 连字符可写可不写（词内空格仍需一致）
  return stripHyphen(a) === stripHyphen(b);
}

/* ============================================================
   会话流程
   ============================================================ */
function startSession(mode) {
  const ids = buildQueue(mode);
  if (!ids.length) { toast('题库未加载'); return; }
  APP.session = {
    mode: mode,          // 'dict' | 'mean'
    ids: ids,
    i: 0,
    correct: 0,
    wrong: 0,
    skipped: 0,
    records: [],         // {id, result:'ok'|'err'|'skip', input, hinted}
    startedAt: Date.now(),
    answered: false,
    hinted: false,
    selected: {}         // for meaning mode
  };
  APP.screen = mode === 'dict' ? 'dict' : 'mean';
  render();
}

function finishSession() {
  const s = APP.session;
  const rec = {
    mode: s.mode,
    at: Date.now(),
    total: s.ids.length,
    correct: s.correct,
    wrong: s.wrong,
    skipped: s.skipped
  };
  STATE.sessions.push(rec);
  if (STATE.sessions.length > 400) STATE.sessions = STATE.sessions.slice(-400);
  saveState();
  APP.screen = 'result';
  render();
}

function advance() {
  const s = APP.session;
  if (s.i + 1 >= s.ids.length) { finishSession(); return; }
  s.i++;
  s.answered = false;
  s.hinted = false;
  s.selected = {};
  render();
}

/* 记录一次作答（dictation） */
function submitDictation(rawInput) {
  const s = APP.session;
  if (s.answered) return;
  const id = s.ids[s.i];
  const w = VOCAB[id];
  const input = String(rawInput || '');
  // 空提交不判错，避免连按回车误伤；想标记不会请点「不会」
  if (!input.trim()) { toast('请先输入单词，或用「不会」记入生词本'); return; }
  const ok = answerMatches(input, w.word);
  const st = statOf(id);
  st.t += 1;
  st.at = Date.now();
  st.last = ok ? 'ok' : 'err';

  s.answered = true;
  const rec = { id: id, result: ok ? 'ok' : 'err', input: input, hinted: s.hinted };
  s.records.push(rec);

  if (ok) {
    s.correct++;
    // 生词本：答对一次即移出
    if (st.nb) { st.nb = false; st.h = false; }
    else { st.h = false; }
  } else {
    s.wrong++;
    st.w += 1;
    st.nb = true;
    if (s.hinted) st.h = true;
  }
  saveState();
  render();

  if (ok) {
    setTimeout(function () {
      if (APP.screen === 'dict' && APP.session && APP.session.answered) advance();
    }, 620);
  }
}

function skipWord(kind) {
  // kind: 'skip'（跳过）或 'dunno'（不会）
  const s = APP.session;
  if (s.answered) return;
  const id = s.ids[s.i];
  const st = statOf(id);
  st.t += 1; st.w += 1; st.nb = true; st.at = Date.now(); st.last = 'err';
  s.answered = true;
  s.skipped++;
  s.records.push({ id: id, result: kind || 'skip', input: '', hinted: s.hinted });
  saveState();
  render();
}

/* 词义检测里的「不会」：直接判错、进生词本，并进入下一题 */
function dunnoMeaning() {
  const s = APP.session;
  if (s.answered) return;
  const id = s.ids[s.i];
  const st = statOf(id);
  st.t += 1; st.w += 1; st.nb = true; st.at = Date.now(); st.last = 'err';
  s.answered = true;
  s.skipped++;
  s.records.push({
    id: id, result: 'dunno', chosen: [],
    correct: s.q.options.map(function (o, i) { return o.correct ? i : -1; }).filter(function (i) { return i >= 0; }),
    correctTexts: s.q.options.filter(function (o) { return o.correct; }).map(function (o) {
      return (o.pos ? o.pos + ' ' : '') + o.text;
    })
  });
  saveState();
  render();
  setTimeout(function () {
    if (APP.screen === 'mean' && APP.session && APP.session.answered) advance();
  }, 900);
}

function useHint() {
  const s = APP.session;
  if (s.answered || s.hinted) return;
  s.hinted = true;
  const id = s.ids[s.i];
  const st = statOf(id);
  st.h = true;
  st.nb = true;   // Q17：用过提示也进生词本
  saveState();
  render();
}

/* 记录一次作答（meaning） */
function submitMeaning() {
  const s = APP.session;
  if (s.answered) return;
  const q = s.q;
  const chosen = Object.keys(s.selected).filter(function (k) { return s.selected[k]; }).map(Number);
  // 一个都没选就不判错，避免连按回车误伤；想标记不会请点「不会」
  if (!chosen.length) { toast('请先选择至少一个释义，或用「不会」记入生词本'); return; }
  const correctIdx = q.options.map(function (o, i) { return o.correct ? i : -1; }).filter(function (i) { return i >= 0; });
  const missing = correctIdx.filter(function (i) { return chosen.indexOf(i) < 0; });
  const extra = chosen.filter(function (i) { return correctIdx.indexOf(i) < 0; });
  const ok = missing.length === 0 && extra.length === 0;

  const id = s.ids[s.i];
  const st = statOf(id);
  st.t += 1; st.at = Date.now(); st.last = ok ? 'ok' : 'err';
  s.answered = true;
  s.records.push({ id: id, result: ok ? 'ok' : 'err', chosen: chosen, correct: correctIdx });

  if (ok) {
    s.correct++;
    if (st.nb) st.nb = false;
  } else {
    s.wrong++;
    st.w += 1;
    st.nb = true;
  }
  saveState();
  render();

  // 全对时自动进入下一题（和默写一致）；答错/漏选留在本题看正确答案
  if (ok) {
    setTimeout(function () {
      if (APP.screen === 'mean' && APP.session && APP.session.answered) advance();
    }, 700);
  }
}

function relatedTerm(a, b) {
  const x = senseKey(a), y = senseKey(b);
  if (!x || !y) return false;
  if (x === y) return true;
  if (RELATED_SET[x] && RELATED_SET[x][y]) return true;
  if (RELATED_SET[y] && RELATED_SET[y][x]) return true;
  // 限定长度后再做包含判断，避免「光」吞掉「星期」
  if (x.length >= 2 && y.length >= 2 && (x.indexOf(y) === 0 || y.indexOf(x) === 0)) return true;

  const x = senseKey(a), y = senseKey(b);

  if (SYN[y] && SYN[y][x]) return true;
  if (RELATED_SET[x] && RELATED_SET[x][y]) return true;
  if (RELATED_SET[y] && RELATED_SET[y][x]) return true;
  if (x.length >= 2 && y.length >= 2 && (x.indexOf(y) >= 0 || y.indexOf(x) >= 0)) return true;

function makeOptions(id) {
  const w = VOCAB[id];
  const groups = (w.groups || []).filter(function (g) { return g.text; });

  // 去掉专指义（带括注的冷门义项），优先用核心义
  const pool = groups.filter(function (g) { return g.kind !== 'specific'; });
  const usable = pool.length ? pool : groups;

  // 正确项：该词 1~3 个「不同概念」义项（同概念/同族/互相包含的不重复选）
  const pickedCorrect = [];
  usable.forEach(function (g) {
    if (pickedCorrect.length >= 3) return;
    if (pickedCorrect.some(function (p) {
      if (p.concept && g.concept && p.concept === g.concept) return true;
      return relatedTerm(p.text, g.text) || sameSense(p.text, g.text);
    })) return;
    pickedCorrect.push({ pos: g.pos, text: g.text, kind: g.kind, concept: g.concept });
  });
  let correct = pickedCorrect;
  if (correct.length > 3) correct = correct.slice(0, 3);
  if (!correct.length) correct = [{ pos: '', text: w.short, kind: 'core', concept: '' }];

  // 选项总数固定 5：正确项之外用其他单词的释义填充
  const need = Math.max(2, 5 - correct.length);
  const mainPos = correct[0].pos || '';
  const banned = correct.map(function (g) { return g.text; });

  const samePos = [], otherPos = [];
  for (let i = 0; i < VOCAB.length; i++) {
    if (i === id) continue;
    const v = VOCAB[i];
    if (!v.groups || !v.groups.length) continue;
    const g0 = v.groups.find(function (g) { return g.kind !== 'specific'; }) || v.groups[0];
    if (!g0 || !g0.text) continue;
    // 干扰项：只用一个义项；太碎的单字义项不拿来做干扰
    if (g0.text.indexOf('，') >= 0) continue;
    const t = g0.text.replace(/[的地]$/, '');
    if (t.length < 2 || t.length > 8) continue;
    if (banned.some(function (b) { return sameSense(b, t); })) continue;
    const bucket = (g0.pos === mainPos) ? samePos : otherPos;
    bucket.push({ pos: g0.pos, text: g0.text, kind: g0.kind });
  }

  const distract = [];
  function takeFrom(arr, k) {
    const s = shuffle(arr);
    for (let i = 0; i < s.length && distract.length < k; i++) {
      const t = s[i];
      if (distract.some(function (d) { return sameSense(d.text, t.text); })) continue;
      if (banned.some(function (b) { return sameSense(b, t.text); })) continue;
      distract.push(t);
    }
  }
  takeFrom(samePos, need);
  if (distract.length < need) takeFrom(otherPos, need - distract.length);
  if (distract.length < need) {
    // 兜底：放宽到任意词性，但仍要求是单一、完整的义项
    const rest = [];
    for (let i = 0; i < VOCAB.length; i++) {
      if (i === id) continue;
      const gs = VOCAB[i].groups || [];
      const g0 = gs.find(function (g) { return g.kind !== 'specific'; }) || gs[0];
      if (!g0 || !g0.text || g0.text.indexOf('，') >= 0) continue;
      const t = g0.text.replace(/[的地]$/, '');
      if (t.length < 2 || t.length > 8) continue;
      if (banned.some(function (b) { return sameSense(b, t); })) continue;
      rest.push({ pos: g0.pos, text: g0.text, kind: g0.kind });
    }
    takeFrom(rest, need);
  }

  const options = correct.map(function (g) {
    return { text: g.text, pos: g.pos, correct: true };
  }).concat(distract.map(function (g) {
    return { text: g.text, pos: g.pos, correct: false };
  }));

  return { options: shuffle(options) };
}

/* 「关键」包含「关键点」这种同族扩展，不算第二个义项 */
function isSubSense(a, b) {
  const x = senseKey(a), y = senseKey(b);
  return x.length >= 2 && y.length >= 2 && (x.indexOf(y) === 0 || y.indexOf(x) === 0);
}

/* ============================================================
   渲染
   ============================================================ */
function render() {
  const app = $('#app');
  let html = '';
  if (APP.screen === 'books') html = viewBooks();
  else if (APP.screen === 'home') html = viewHome();
  else if (APP.screen === 'dict') html = viewDict();
  else if (APP.screen === 'mean') html = viewMean();
  else if (APP.screen === 'result') html = viewResult();
  else if (APP.screen === 'notebook') html = viewNotebook();
  app.innerHTML = html;
  window.scrollTo(0, 0);
  bindScreen();
}

function topbar(title, backTo) {
  let h = '<div class="topbar">';
  if (backTo) {

    h += '<button class="icon-btn" data-nav="home">首页</button>';
  }
  h += '</div>';
  return h;
}

function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }

function notebookCount() {
  let n = 0;
  for (const k in STATE.stats) if (STATE.stats[k].nb) n++;
  return n;
}

function viewHome() {

  STATE.sessions.forEach(function (s) { tot += s.total; cor += s.correct; });
  const rate = pct(cor, tot);
  const studied = Object.keys(STATE.stats).filter(function (k) { return STATE.stats[k].t > 0; }).length;
  const book = BOOKS.filter(function (b) { return b.id === APP.book; })[0] || BOOKS[0];

  let h = '<div class="topbar"><button class="icon-btn" data-nav="books">← 词书</button>';

  h += '<div class="hero" style="padding-top:14px"><h1>' + esc(book.name) + '</h1><p>看中文写英文 · 看英文选释义 · 错词反复练</p></div>';
  h += '<div class="mode-grid">';
  h += '<button class="mode" data-start="dict"><span class="emoji">✍️</span><span class="name">默写检测</span><span class="desc">给出中文释义，写出英文单词<br>共 ' + (STATE.settings.size || 25) + ' 题</span><span class="stat">提示 · 不会 · 生词本</span></button>';
  h += '<button class="mode" data-start="mean"><span class="emoji">✅</span><span class="name">词义检测</span><span class="desc">给出英文单词，选出正确释义<br>共 ' + (STATE.settings.size || 25) + ' 题</span><span class="stat">多选 · 全对才算</span></button>';
  h += '<button class="mode" data-nav="notebook"><span class="emoji">📕</span><span class="name">生词本</span><span class="desc">查看错词与错误次数<br>随时复习、手动移除</span><span class="stat">当前 ' + nb + ' 个</span></button>';
  h += '</div>';

function dataTools() {

/* ---------- 默写 ---------- */

    const last = s.records[s.records.length - 1];

      h += '<div class="feedback show ok">✓ 回答正确' + (last.hinted ? '（本次用过提示，已记入生词本）' : '') + '</div>';
    } else if (last.result === 'dunno') {
      h += '<div class="feedback show skip"><div class="line"><span class="k">不会</span><span class="v">已放入生词本</span></div>';

    } else {

      h += '<div class="line"><span class="k">你的输入</span><span class="v you">' + (last.input ? esc(last.input) : '（空）') + '</span></div>';

    }

function hintText(word, reveal) {
  const w = String(word);
  const n = Math.max(1, Math.min(reveal || 1, w.length));
  const shown = w.slice(0, n).split('').join(' ');
  if (w.length <= n) return shown;
  return shown + ' ' + '_'.repeat(w.length - n);
}

/* ---------- 词义 ---------- */
function ensureQuestion() {
  const s = APP.session;
  if (!s.q || s.q.id !== s.ids[s.i]) {
    const id = s.ids[s.i];
    const q = makeOptions(id);
    q.id = id;
    s.q = q;
    s.selected = {};
  }
}

function viewMean() {
  const s = APP.session;
  ensureQuestion();
  const id = s.ids[s.i];
  const w = VOCAB[id];
  const q = s.q;
  const total = s.ids.length;

  let h = topbar('词义检测', null);
  h += '<div class="progress-wrap"><div class="progress-head"><span>第 <b>' + (s.i + 1) + '</b> / ' + total + ' 题</span>';
  h += '<span>✅ ' + s.correct + ' · ❌ ' + s.wrong + '</span></div>';
  h += '<div class="bar"><i style="width:' + pct(s.i, total) + '%"></i></div></div>';

  h += '<div class="card">';
  h += '<div class="word-head"><div class="big">' + esc(w.word) + '</div></div>';
  h += '<div class="prompt-label">选出这个词的正确释义' + (q.options.filter(function (o) { return o.correct; }).length > 1 ? '（不止一个）' : '') + '</div>';

  h += '<div class="options">';
  q.options.forEach(function (o, i) {
    let cls = 'opt';
    if (s.answered) {
      cls += ' locked';
      if (o.correct) cls += ' correct';
      else if (s.selected[i]) cls += ' wrong';
    } else if (s.selected[i]) {
      cls += ' sel';
    }
    h += '<button class="' + cls + '" data-opt="' + i + '"' + (s.answered ? ' disabled' : '') + '>';
    h += '<span class="box">' + (o.correct && s.answered ? '✓' : (s.selected[i] ? '✓' : '')) + '</span>';
    h += '<span class="txt">' + (o.pos ? '<em class="pos">' + esc(o.pos) + '</em>' : '') + esc(o.text) + '</span></button>';
  });
  h += '</div>';

  h += '<div class="actions">';
  if (!s.answered) {
    h += '<button class="btn btn-ghost" data-act="dunno">🤷 不会</button>';
    h += '<button class="btn btn-primary" data-act="submit">提交</button>';
  } else {
    h += '<button class="btn btn-primary" data-act="next">下一题 →</button>';
  }
  h += '</div>';

  if (s.answered) {
    const last = s.records[s.records.length - 1];
    const chosen = last.chosen || [];
    if (last.result === 'ok') {
      h += '<div class="feedback show ok">✓ 回答正确，正在进入下一题…</div>';
    } else if (last.result === 'dunno') {
      const correctIdx = last.correct || [];
      h += '<div class="feedback show skip"><div class="line"><span class="k">不会</span><span class="v">已放入生词本</span></div>';
      h += '<div class="line"><span class="k">正确答案</span><span class="v">' + correctIdx.map(function (i) { return (q.options[i].pos ? q.options[i].pos + ' ' : '') + esc(q.options[i].text); }).join(' / ') + '</span></div></div>';
    } else {
      const correctIdx = last.correct || [];
      const missing = correctIdx.filter(function (i) { return chosen.indexOf(i) < 0; });
      const extra = chosen.filter(function (i) { return correctIdx.indexOf(i) < 0; });
      let msg = [];
      if (missing.length) msg.push('漏选 ' + missing.length + ' 项');
      if (extra.length) msg.push('错选 ' + extra.length + ' 项');
      h += '<div class="feedback show err"><div class="line"><span class="k">结果</span><span class="v">✗ ' + msg.join('，') + '</span></div>';
      h += '<div class="line"><span class="k">正确答案</span><span class="v">' + correctIdx.map(function (i) { return (q.options[i].pos ? q.options[i].pos + ' ' : '') + esc(q.options[i].text); }).join(' / ') + '</span></div>';
      h += '<div class="line"><span class="k">生词本</span><span class="v" style="font-weight:500;color:#b3261e">已加入，错误 ' + statOf(id).w + ' 次</span></div></div>';
    }
  }
  h += '</div>';
  return h;
}

/* ---------- 结果 ---------- */

  h += '<div class="result-line">共 <b>' + total + '</b> 题 · 答对 <b>' + s.correct + '</b> · 答错 <b>' + s.wrong + '</b> · 不会 <b>' + s.skipped + '</b></div>';

    h += '<div class="result-line" style="margin-top:4px">答错与不会的单词都已加入生词本</div>';
  } else {
    h += '<div class="result-line" style="margin-top:4px;color:#0b7a44">全部答对，这一组没有新增生词 🎉</div>';
  }
  h += '</div>';
  h += '<div class="actions" style="margin-top:20px">';
  h += '<button class="btn btn-primary" data-start="' + s.mode + '">再来一组</button>';
  h += '<button class="btn btn-ghost" data-nav="notebook">看生词本</button>';
  h += '<button class="btn btn-ghost" data-nav="home">回首页</button>';
  h += '</div></div>';

  if (wrongRecs.length) {
    h += '<div class="wrong-list"><h3>本场错题（' + wrongRecs.length + '）</h3><div class="wlist">';
    wrongRecs.forEach(function (r) {
      const w = VOCAB[r.id];
      let tag = '<span class="tag">答错</span>';
      if (r.result === 'skip') tag = '<span class="tag skip">跳过</span>';
      else if (r.result === 'dunno') tag = '<span class="tag skip">不会</span>';
      else if (r.hinted) tag = '<span class="tag hint">用过提示</span>';
      h += '<div class="wrow"><div class="top"><span class="w">' + esc(w.word) + '</span>' + tag + '</div>';
      h += '<div class="m">' + esc(w.short) + '</div>';

        h += '<div class="a">你的输入：<b>' + (r.input ? esc(r.input) : '（空）') + '</b></div>';

        h += '<div class="a">正确答案：<b>' + esc((r.correctTexts || []).join(' / ')) + '</b></div>';
      }
      h += '</div>';
    });
    h += '</div></div>';
  }
  return h;
}

/* ---------- 生词本 ---------- */
function viewNotebook() {
  const ids = Object.keys(STATE.stats)
    .filter(function (k) { return STATE.stats[k].nb; })
    .map(Number);
  ids.sort(function (a, b) {
    const sa = STATE.stats[a], sb = STATE.stats[b];
    return (sb.w - sa.w) || ((sb.at || 0) - (sa.at || 0));
  });

  let h = topbar('生词本', 'home');
  h += '<div class="card" style="padding:18px 18px 20px">';
  h += '<div class="nb-head" style="margin-bottom:0"><div><div style="font-weight:700;font-size:18px">共 ' + ids.length + ' 个生词</div>';
  h += '<div style="color:var(--muted);font-size:13.5px">错误次数越多，被优先考到的概率越高</div></div>';
  if (ids.length) h += '<button class="icon-btn" data-act="clear-notebook">清空</button>';
  h += '</div></div>';

  if (!ids.length) {
    h += '<div class="empty"><span class="big">🎉</span>还没有生词<br>做一组检测，答错或跳过的词会自动收进来</div>';
    return h;
  }
  h += '<div class="nb-list" style="margin-top:14px">';
  ids.forEach(function (id) {
    const w = VOCAB[id], st = STATE.stats[id];
    h += '<div class="nb-item"><div class="main">';
    h += '<div class="w">' + esc(w.word) + (st.w ? '<span class="badge">×' + st.w + '</span>' : '<span class="badge hint">提示</span>') + '</div>';
    h += '<div class="m">' + esc(w.short) + '</div>';
    h += '<div class="meta">考察 ' + st.t + ' 次 · ' + (st.w ? '错误 ' + st.w + ' 次' : '仅用过提示') + '</div>';
    h += '</div><button class="del" data-remove="' + id + '">移出</button></div>';
  });
  h += '</div>';
  return h;
}

/* ============================================================
   事件绑定
   ============================================================ */
function bindScreen() {
  // navigation
  $$('[data-nav]').forEach(function (b) {
    b.addEventListener('click', function () {
      const to = b.getAttribute('data-nav');
      if (to === 'home' && APP.session && !(APP.screen === 'result')) {
        if (!confirm('离开当前检测？已答题目会保留在统计里。')) return;
        APP.session = null;
      }
      if (to === 'books' && APP.session) {
        if (!confirm('离开当前检测？已答题目会保留在统计里。')) return;
        APP.session = null;
      }
      APP.screen = to;
      render();
    });
  });
  $$('[data-book]').forEach(function (b) {
    b.addEventListener('click', function () {
      APP.book = b.getAttribute('data-book');
      APP.screen = 'home';
      render();
    });
  });
  $$('[data-soon]').forEach(function (b) {
    b.addEventListener('click', function () {
      toast(b.getAttribute('data-soon') + ' 尚未上线，敬请期待', 2200);
    });
  });
  $$('[data-start]').forEach(function (b) {
    b.addEventListener('click', function () { startSession(b.getAttribute('data-start')); });
  });

  const ans = $('#answer');
  if (ans) {
    ans.focus();
    ans.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); submitFromInput(); }
    });
  }
  // 默写：答完（含答错/不会/跳过）后按回车即可进入下一题，全程可用键盘
  if (!APP._dictKey) {
    APP._dictKey = function (e) {
      if (e.key !== 'Enter') return;
      if (APP.screen !== 'dict' || !APP.session) return;
      // 输入框里的回车交给输入框自己处理（提交答案）
      if (e.target && e.target.id === 'answer') return;
      if (APP.session.answered) { e.preventDefault(); advance(); }
    };
    document.addEventListener('keydown', APP._dictKey);
  }
  if (APP.screen === 'mean') {
    if (!APP._meanKey) {
      APP._meanKey = function (e) {
        if (e.key === 'Enter' && APP.screen === 'mean' && APP.session) {
          e.preventDefault();
          if (APP.session.answered) advance(); else submitMeaning();
        }
      };
      document.addEventListener('keydown', APP._meanKey);
    }
  }
  $$('[data-act]').forEach(function (b) {
    b.addEventListener('click', function () {
      const act = b.getAttribute('data-act');
      if (act === 'hint') useHint();
      else if (act === 'skip') skipWord('skip');
      else if (act === 'dunno') {
        if (APP.screen === 'mean') dunnoMeaning();
        else skipWord('dunno');
      } else if (act === 'submit') {
        if (APP.screen === 'dict') submitFromInput();
        else submitMeaning();
      } else if (act === 'next') advance();
      else if (act === 'export') exportData();
      else if (act === 'reset') confirmReset();
      else if (act === 'clear-notebook') clearNotebook();
    });
  });
  $$('[data-opt]').forEach(function (b) {
    b.addEventListener('click', function () {
      const s = APP.session;
      if (!s || s.answered) return;
      const i = Number(b.getAttribute('data-opt'));
      s.selected[i] = !s.selected[i];
      render();
    });
  });
  $$('[data-remove]').forEach(function (b) {
    b.addEventListener('click', function () {
      const id = Number(b.getAttribute('data-remove'));
      if (STATE.stats[id]) { STATE.stats[id].nb = false; saveState(); render(); toast('已移出生词本'); }
    });
  });
  const imp = $('[data-act="import"]');
  if (imp) imp.addEventListener('change', importData);
}

function submitFromInput() {
  const el = $('#answer');
  if (!el) return;
  submitDictation(el.value);
}

/* ============================================================
   导入 / 导出 / 重置
   ============================================================ */
function exportData() {
  const data = JSON.stringify(STATE, null, 1);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const pad = function (n) { return String(n).padStart(2, '0'); };
  const name = 'cet4-vocab-backup-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.json';
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  toast('已导出备份文件');
}

function importData(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function () {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj || typeof obj !== 'object' || !obj.stats) throw new Error('格式不对');
      if (!confirm('导入会覆盖当前学习记录，确定继续吗？')) return;
      STATE = Object.assign({}, DEFAULT_STATE, obj, {
        stats: obj.stats || {},
        sessions: Array.isArray(obj.sessions) ? obj.sessions : [],
        settings: Object.assign({}, DEFAULT_STATE.settings, obj.settings || {})
      });
      saveState();
      toast('导入成功');
      APP.screen = 'home';
      render();
    } catch (err) {
      toast('导入失败：' + (err.message || '文件格式不正确'));
    }
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
}

function confirmReset() {
  if (!confirm('确定清空全部学习记录？此操作不可撤销。')) return;
  localStorage.removeItem(STORE_KEY);
  STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
  APP.session = null;
  saveState();
  toast('已清空');
  APP.screen = 'home';
  render();
}

function clearNotebook() {
  if (!confirm('确定清空生词本？单词的错误次数也会一并清除。')) return;
  for (const k in STATE.stats) { STATE.stats[k].nb = false; STATE.stats[k].h = false; STATE.stats[k].w = 0; }
  saveState();
  render();
  toast('生词本已清空');
}

/* ============================================================
   启动
   ============================================================ */
render();
</script>
</body>
</html>
